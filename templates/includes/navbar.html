{% load static %}

<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom shadow-sm px-4 py-2 mb-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">

        <div class="d-flex align-items-center">
            <i class="bi bi-check2-square fs-3 me-2 text-primary"></i>
            <span class="fs-4 fw-bold text-dark">TM Manager</span>
        </div>

        <div class="d-flex align-items-center">
            {% if not user.is_authenticated %}

                <a href="{% url 'users:login' %}"
                   class="nav-link px-3 py-1 text-success fw-semibold border
                   border-success rounded-pill hover-shadow">
                    <i class="bi bi-box-arrow-right me-2"></i>Увійти
                </a>

            {% else %}

                <span class="me-3 text-muted small">Привіт

                    {% if user.first_name %}
                        <strong> {{ user.first_name }} </strong>
                    {% endif %}

                </span>
                    <form action="{% url 'users:logout' %}" method="POST">
                    {% csrf_token %}

                    <button type="submit" class="nav-link px-3 py-1 text-danger
                        fw-semibold border border-danger rounded-pill">
                        <i class="bi bi-box-arrow-left me-2"></i>Вийти
                    </button>

                </form>
            {% endif %}
        </div>

    </div>
</nav>
