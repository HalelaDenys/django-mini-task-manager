{% load static %}

<nav class="col-md-3 col-lg-2 d-md-block sidebar  p-3">
    <div class="d-flex align-items-center mb-4">
        <i class="bi bi-check2-square fs-3 me-2 text-primary"></i>
        <span class="fs-4 fw-bold">TM Manager</span>
    </div>

    {% if user.is_authenticated %}
        <div>
            <div class="accordion" id="sidebarMenu">
                <div class="accordion-item border-0">
                    <h2 class="accordion-header" id="headingTasks">
                        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTasks">
                            <i class="bi bi-list-task me-2"></i> Мої Завдання
                        </button>
                    </h2>
                    <div id="collapseTasks" class="accordion-collapse collapse show" data-bs-parent="#sidebarMenu">
                        <div class="accordion-body p-0">
                            <ul class="nav flex-column">
                                <li class="nav-item"><a class="nav-link px-4 py-2" href="#"><i class="bi bi-star me-2"></i>Важливі</a></li>
                                <li class="nav-item"><a class="nav-link px-4 py-2" href="#"><i class="bi bi-clock me-2"></i>На сьогодні</a></li>
                                <li class="nav-item"><a class="nav-link px-4 py-2" href="#"><i class="bi bi-calendar-check me-2"></i>Усі завдання</a></li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="accordion-item border-0">
                    <h2 class="accordion-header" id="headingProjects">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseProjects">
                            <i class="bi bi-folder me-2"></i> Проєкти
                        </button>
                    </h2>
                    <div id="collapseProjects" class="accordion-collapse collapse" data-bs-parent="#sidebarMenu">
                        <div class="accordion-body p-0">
                            <ul class="nav flex-column">
                                <li class="nav-item"><a class="nav-link px-4 py-2" href="#">Робота</a></li>
                                <li class="nav-item"><a class="nav-link px-4 py-2" href="#">Особисте</a></li>
                                <li class="nav-item"><a class="nav-link px-4 py-2" href="#">+ Новий проєкт</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <hr>
            <div class="mt-auto">
                <a href="#" class="nav-link px-2 text-danger"><i class="bi bi-box-arrow-left me-2"></i>Вийти</a>
            </div>
        </div>
    {% else %}
        <div>
            <div class="mt-auto">
                <a href="{% url 'users:login' %}" class="nav-link px-2 text-success">
                    <i class="bi bi-box-arrow-right me-2"></i>Увійти
                </a>
            </div>
        </div>
    {% endif %}

</nav>
