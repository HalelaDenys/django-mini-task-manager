{% extends 'base.html' %}

{% block title %}Вхід — TM Manager{% endblock %}

{% block content %}
   <div class="col-md-9 ms-sm-auto col-lg-12 px-md-4 py-4">
       <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
            <div class="col-md-5 col-lg-4">

                <div class="card shadow-sm border-0 p-4">

                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
                        <h2 class="fw-bold mt-2">З поверненням!</h2>
                        <p class="text-muted">Будь ласка, увійдіть у свій акаунт</p>
                    </div>

                    <form action="{% url 'users:login' %}" method="POST">
                        {% csrf_token %}

                        <input type="hidden" name="next" value="{{ request.GET.next }}">

                        <div class="mb-3">
                            <label for="id_email" class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                                <input type="text" name="username" class="form-control border-start-0 bg-light"
                                       id="id_email" placeholder="Ваш email" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="id_password" class="form-label">Пароль</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-key"></i></span>
                                <input type="password" name="password" class="form-control border-start-0 bg-light"
                                       id="id_password" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="mb-3 d-flex justify-content-end">
                            <a href="{% url 'users:reset_password' %}" class="small text-decoration-none">Забули пароль?</a>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm">Увійти</button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="small mb-0">Ще не маєте акаунту?
                            <a href="{% url 'users:register' %}" class="fw-bold text-decoration-none">Зареєструватися</a>
                        </p>
                    </div>
                </div>
            </div>
       </div>
   </div>
{% endblock %}
